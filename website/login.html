<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Client Sign In | Shelby Hiver</title>
  <meta name="description" content="Sign in to your Shelby Hiver account to manage orders, track delivery, and access exclusive drops.">
  <link rel="canonical" href="https://shelbyhiver.in/login.html">
  <meta property="og:site_name" content="Shelby Hiver">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page-wrap">
    <!-- Top Navigation -->
    <header class="auth-page-nav">
      <a href="index.html" class="auth-nav-brand" aria-label="Shelby Hiver Home">
        <img src="assets/logo-dark.png" alt="Shelby Hiver">
      </a>
      <a href="index.html" class="auth-nav-back">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Return to Store</span>
      </a>
    </header>

    <!-- Main Container -->
    <main class="auth-main-container">
      <div class="auth-card-shell">
        
        <div class="auth-tabs-toggle">
          <a href="login.html" class="auth-tab-link active">Sign In</a>
          <a href="register.html" class="auth-tab-link">Register</a>
        </div>

        <div class="auth-heading-row">
          <span class="auth-form-tag">AUTHENTICATION</span>
          <h1 class="auth-form-heading">Client Portal</h1>
          <p class="auth-form-sub">Sign in with your email or mobile number to track orders and manage your drop selections.</p>
        </div>

        <div class="auth-error-banner" id="authErrorBanner"></div>

        <form id="loginForm" onsubmit="handleLoginPageSubmit(event)">
          <div class="auth-field-block">
            <label class="auth-field-label" for="loginIdentifier">Email or Mobile Number</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
              </span>
              <input type="text" id="loginIdentifier" placeholder="e.g. client@shelbyhiver.com or 9286511557" required autocomplete="username" autofocus>
            </div>
          </div>

          <div class="auth-field-block">
            <div class="auth-field-label">
              <span>Password</span>
              <a href="javascript:void(0)" onclick="handleForgotPassword()">Forgot Password?</a>
            </div>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="auth-toggle-pwd" id="pwdToggleBtn" onclick="togglePasswordVisibility('loginPassword')" aria-label="Toggle password visibility">
                <svg id="pwdEyeIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="auth-action-btn" id="loginSubmitBtn">
            <span>Sign In</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <div class="auth-switch-footer">
            New to Shelby Hiver? <a href="register.html">Create an Account</a>
          </div>

          <div class="auth-social-strip">
            <span class="auth-social-lbl">Official Atelier:</span>
            <a href="https://www.instagram.com/shelbyhiver" target="_blank" rel="noopener noreferrer" class="auth-social-icon-btn btn-instagram" aria-label="Instagram" title="Instagram @shelbyhiver">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5.5" ry="5.5"></rect>
                <circle cx="12" cy="12" r="4.2"></circle>
                <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"></circle>
              </svg>
            </a>
            <a href="https://www.facebook.com/profile.php?id=61594037143588" target="_blank" rel="noopener noreferrer" class="auth-social-icon-btn btn-facebook" aria-label="Facebook" title="Facebook Atelier">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                <path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.52-.14-2.82-.14-2.78 0-4.68 1.7-4.68 4.8v2.7H7v4h3v9.5h4v-9.5z"/>
              </svg>
            </a>
          </div>
        </form>

      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Redirect if already authenticated
    (function checkAlreadyLoggedIn() {
      const u = getCurrentUser();
      if (u) {
        window.location.replace("index.html");
      }
    })();

    function handleLoginPageSubmit(e) {
      e.preventDefault();
      const errorBox = document.getElementById("authErrorBanner");
      errorBox.style.display = "none";

      const id = document.getElementById("loginIdentifier").value;
      const pwd = document.getElementById("loginPassword").value;

      const res = loginUser(id, pwd);
      if (res.success) {
        const btn = document.getElementById("loginSubmitBtn");
        btn.innerHTML = `<span>Verified · Redirecting...</span>`;
        btn.style.background = "#111111";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 350);
      } else {
        errorBox.textContent = res.error;
        errorBox.style.display = "block";
      }
    }

    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      const icon = document.getElementById("pwdEyeIcon");
      if (!field) return;
      if (field.type === "password") {
        field.type = "text";
        if (icon) {
          icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
        }
      } else {
        field.type = "password";
        if (icon) {
          icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        }
      }
    }

    function handleForgotPassword() {
      const email = prompt("Enter your registered email address:");
      if (!email) return;
      const users = getStoredUsers();
      const found = users.find(u => u.email.toLowerCase() === email.trim().toLowerCase());
      if (found) {
        alert(`Account located: Password is "${found.password}". You may now sign in.`);
      } else {
        alert("No account found with that email address. Please register.");
      }
    }
  </script>
</body>
</html>
