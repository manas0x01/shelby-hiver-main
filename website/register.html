<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Create an Account | Shelby Hiver</title>
  <meta name="description" content="Register an account with Shelby Hiver for fast checkout, early access to heavyweight archive drops, and order tracking.">
  <link rel="canonical" href="https://shelbyhiver.in/register.html">
  <meta property="og:site_name" content="Shelby Hiver">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page-wrap">
    <!-- Top Navigation -->
    <header class="auth-page-nav">
      <a href="index.html" class="auth-nav-brand" aria-label="Shelby Hiver Home">
        <img src="assets/logo-dark.png" alt="Shelby Hiver">
      </a>
      <a href="index.html" class="auth-nav-back">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Return to Store</span>
      </a>
    </header>

    <!-- Main Container -->
    <main class="auth-main-container">
      <div class="auth-card-shell">
        
        <div class="auth-tabs-toggle">
          <a href="login.html" class="auth-tab-link">Sign In</a>
          <a href="register.html" class="auth-tab-link active">Register</a>
        </div>

        <div class="auth-heading-row">
          <span class="auth-form-tag">NEW CLIENT ONBOARDING</span>
          <h1 class="auth-form-heading">Create Account</h1>
          <p class="auth-form-sub">Register to secure your Drop 01 orders, expedited dispatch, and client drape advisory.</p>
        </div>

        <div class="auth-error-banner" id="authErrorBanner"></div>

        <form id="registerForm" onsubmit="handleRegisterPageSubmit(event)">
          <div class="auth-field-block">
            <label class="auth-field-label" for="regName">Full Legal Name</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input type="text" id="regName" placeholder="e.g. Manas Verma" required autocomplete="name" autofocus>
            </div>
          </div>

          <div class="auth-field-block">
            <label class="auth-field-label" for="regEmail">Email Address</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
              </span>
              <input type="email" id="regEmail" placeholder="client@shelbyhiver.com" required autocomplete="email">
            </div>
          </div>

          <div class="auth-field-block">
            <label class="auth-field-label" for="regPhone">Mobile Number (10 digits)</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                  <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
              </span>
              <input type="tel" id="regPhone" placeholder="9286511557" maxlength="10" required autocomplete="tel">
            </div>
          </div>

          <div class="auth-field-block">
            <label class="auth-field-label" for="regPassword">Password (minimum 6 characters)</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input type="password" id="regPassword" placeholder="Create a secure password" required autocomplete="new-password">
              <button type="button" class="auth-toggle-pwd" id="regPwdToggleBtn" onclick="togglePasswordVisibility('regPassword')" aria-label="Toggle password visibility">
                <svg id="regEyeIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-field-block">
            <label class="auth-field-label" for="regConfirmPassword">Confirm Password</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
            </div>
          </div>

          <button type="submit" class="auth-action-btn" id="regSubmitBtn">
            <span>Complete Registration</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <div class="auth-switch-footer">
            Already have an account? <a href="login.html">Sign In Here</a>
          </div>
        </form>

      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Redirect if already authenticated
    (function checkAlreadyLoggedIn() {
      const u = getCurrentUser();
      if (u) {
        window.location.replace("index.html");
      }
    })();

    function handleRegisterPageSubmit(e) {
      e.preventDefault();
      const errorBox = document.getElementById("authErrorBanner");
      errorBox.style.display = "none";

      const name = document.getElementById("regName").value;
      const email = document.getElementById("regEmail").value;
      const phone = document.getElementById("regPhone").value;
      const password = document.getElementById("regPassword").value;
      const confirmPassword = document.getElementById("regConfirmPassword").value;

      if (password !== confirmPassword) {
        errorBox.textContent = "Passwords do not match. Please re-enter.";
        errorBox.style.display = "block";
        return;
      }

      const res = registerUser({ name, email, phone, password });
      if (res.success) {
        const btn = document.getElementById("regSubmitBtn");
        btn.innerHTML = `<span>Registration Complete · Redirecting...</span>`;
        btn.style.background = "#111111";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 350);
      } else {
        errorBox.textContent = res.error;
        errorBox.style.display = "block";
      }
    }

    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      const icon = document.getElementById("regEyeIcon");
      if (!field) return;
      if (field.type === "password") {
        field.type = "text";
        if (icon) {
          icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
        }
      } else {
        field.type = "password";
        if (icon) {
          icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        }
      }
    }
  </script>
</body>
</html>
